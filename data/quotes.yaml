lines:
  - pre: "Keep your eyes on the stars, and your feet on the ground. \n"
    accent: "- Theodore Roosevelt"

  - pre: "I have loved the stars too fondly to be fearful of the night. \n"
    accent: "- Sarah Williams (1837-1868)"

  - pre: "I often think that the night is more alive and more richly colored than the day. \n"
    accent: "- Vincent Van Gogh"

  - pre: "The stars are the jewels of the night and perchance surpass anything which day has to show. \n"
    accent: "- Henry David Thoraeu"

  - pre: "Astronomy compels the soul to look upwards and leads us from this world to another. \n"
    accent: "- Plato"
